name: Aktualizace jízd ze Stravy
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-strava:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalace závislostí
        run: pip install requests pynacl
      - name: Stáhnout aktuální aktivity ze Stravy
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/update_strava_csv.py
      - name: Uložit aktualizovaná data do repozitáře
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/strava_activities_2025_2026.csv
          git diff --cached --quiet || (git commit -m "Automatická aktualizace jízd ze Stravy" && git push)
